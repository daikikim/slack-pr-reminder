name: PR Reminder

on:
  schedule:
    # 平日 10:00〜19:00 の毎時0分（JST）
    # JST 10:00 = UTC 01:00, JST 19:00 = UTC 10:00
    - cron: '0 1-10 * * 1-5'
  workflow_dispatch: # 手動実行も可能

jobs:
  remind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pr_reminder # ツールコードが配置されているディレクトリ
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -o pr-reminder ./src/cmd/pr-reminder

      - name: Run PR Reminder
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: ./pr-reminder -config config.yaml
