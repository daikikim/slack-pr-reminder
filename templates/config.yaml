github:
  repository: "owner/repo"  # 対象リポジトリを owner/repo 形式で記載してください

slack:
  channel: "#your-channel"  # 通知先のスラックチャンネルを記載してください
  mapping:
    # GitHubユーザー名: SlackのメンバーID
    # 例: "github_user": "U12345678"
    "github_user1": "U12345678"

schedule:
  business_hours:
    start: "10:00"
    end: "19:00"
  timezone: "Asia/Tokyo"
  holidays:
    - "2025-01-01"
  new_year_break:
    start: "12-29"
    end: "01-03"
